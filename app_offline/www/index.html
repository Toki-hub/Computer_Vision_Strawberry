<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16181a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Cek Strawberry</title>
<style>
  :root {
    --bg: #0e0f10; --bar: #16181a; --line: rgba(255, 255, 255, .14);
    --text: #f2f2f2; --muted: #a9adb2; --accent: #e5484d; --ok: #3fb950; --warn: #d29922; --bad: #f85149;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  body { display: flex; flex-direction: column; height: 100dvh; }
  /* gambar kamera di antara panel atas dan bawah, supaya tidak ada bagian yang tertutup */
  #stage { position: relative; flex: 1; min-height: 0; order: 1; background: #000; }
  video, #overlay, #still { position: absolute; inset: 0; width: 100%; height: 100%; }
  video, #still { object-fit: contain; }
  #still { display: none; }
  #overlay { pointer-events: none; }

  .bar { padding: 10px 12px; background: var(--bar); }
  #top { order: 0; padding-top: max(10px, env(safe-area-inset-top)); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  #bottom { order: 2; padding-bottom: max(12px, env(safe-area-inset-bottom)); display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }

  .chip { padding: 4px 9px; border-radius: 999px; border: 1px solid var(--line); font-size: 12.5px; white-space: nowrap; }
  .chip.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 50%, transparent); }
  .chip.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 50%, transparent); }
  .chip.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 50%, transparent); }
  .chip[hidden] { display: none; }
  .chip.busy { color: #4ea1ff; border-color: rgba(78, 161, 255, .5); animation: pulse 1s ease-in-out infinite alternate; }
  @keyframes pulse { from { opacity: 1; } to { opacity: .45; } }
  #stat { margin-left: auto; color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }

  #modes { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  #modes button { border: 0; border-radius: 0; background: transparent; color: var(--muted); padding: 10px 4px; font-weight: 600; }
  #modes button[aria-pressed="true"] { background: var(--accent); color: #fff; }

  #list { max-height: 18vh; overflow-y: auto; display: grid; gap: 4px; font-size: 14px; }
  #list:empty { display: none; }
  .row { display: flex; justify-content: space-between; gap: 8px; padding: 6px 8px; border-radius: 8px; background: rgba(255, 255, 255, .05); }
  .row b { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
  .row span { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }

  .controls { display: flex; gap: 10px; align-items: center; }
  .controls label { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
  .controls label:only-child, .controls label:first-child:has(input[type=range]) { flex: 1; min-width: 0; }
  input[type=range] { flex: 1; min-width: 0; width: 100%; accent-color: var(--accent); }
  .settings { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .settings label { display: grid; gap: 3px; color: var(--muted); font-size: 12px; min-width: 0; }
  .settings select { width: 100%; min-width: 0; }
  select { font: inherit; font-size: 13px; color: var(--text); background: rgba(255, 255, 255, .08); border: 1px solid var(--line); border-radius: 8px; padding: 4px 6px; }
  button { font: inherit; color: var(--text); background: rgba(255, 255, 255, .08); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 12px; cursor: pointer; }
  button:active { transform: scale(.97); }
  button.primary { background: var(--accent); border-color: transparent; color: #fff; font-weight: 600; }
  button[hidden] { display: none; }
  .actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .actions button { padding: 10px 4px; font-size: 14px; }

  .screen { position: fixed; inset: 0; z-index: 3; display: none; place-items: center; padding: 24px; background: rgba(0, 0, 0, .88); text-align: center; }
  .screen.show { display: grid; }
  .screen > div { max-width: 420px; width: 100%; }
  .screen p { color: var(--muted); }
  #progress { height: 8px; border-radius: 99px; background: rgba(255, 255, 255, .12); overflow: hidden; margin: 14px 0 8px; }
  #progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .15s; }
  #toast { position: fixed; left: 50%; bottom: 50%; transform: translateX(-50%); z-index: 4; background: #222; border: 1px solid var(--line);
    padding: 10px 14px; border-radius: 10px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; }
  #toast.show { opacity: 1; }
  input[type=file] { display: none; }
</style>
</head>
<body>
<div id="stage">
  <video id="video" playsinline muted autoplay></video>
  <img id="still" alt="">
  <canvas id="overlay"></canvas>
</div>

<div id="top" class="bar">
  <span id="light" class="chip">Cahaya: -</span>
  <span id="offline" class="chip">Offline: -</span>
  <span id="busy" class="chip busy" hidden>Menganalisis…</span>
  <span id="stat"></span>
</div>

<div id="bottom" class="bar">
  <div id="list"></div>
  <div id="modes" role="group" aria-label="Model">
    <button data-mode="penyakit" aria-pressed="true">Penyakit</button>
    <button data-mode="kematangan" aria-pressed="false">Kematangan</button>
    <button data-mode="keduanya" aria-pressed="false">Keduanya</button>
  </div>
  <div class="controls">
    <label>Ambang <input id="conf" type="range" min="0.1" max="0.9" step="0.05" value="0.35"> <output id="confv">0.35</output></label>
  </div>
  <div class="settings">
    <label>Ukuran<select id="size"><option>640</option></select></label>
    <label>Area<select id="area"><option value="tengah">Kotak tengah</option><option value="penuh">Layar penuh</option></select></label>
    <label>Mesin<select id="engine"><option value="gpu">GPU</option><option value="cpu">CPU</option></select></label>
  </div>
  <div class="actions">
    <button id="pause">Jeda</button>
    <button id="torch" hidden>Senter</button>
    <button id="flip">Ganti kamera</button>
    <button id="gallery">Galeri</button>
    <button id="save" class="primary" style="grid-column: 1 / -1">Simpan foto ke HP</button>
  </div>
</div>

<div id="loading" class="screen show"><div>
  <h2>Cek Strawberry</h2>
  <p id="loadText">Memulai...</p>
  <div id="progress"><i></i></div>
  <p id="loadNote" style="font-size: 13px">Pertama kali, model (~75 MB) diunduh sekali lalu disimpan di HP. Setelah itu aplikasi jalan tanpa internet.</p>
</div></div>

<div id="msg" class="screen"><div>
  <h2 id="msgTitle"></h2><p id="msgText"></p>
  <button id="retry" class="primary">Coba lagi</button> <button id="msgGallery">Uji foto dari galeri</button>
</div></div>
<div id="toast"></div>
<input id="file" type="file" accept="image/*">

<script src="ort/ort.min.js"></script>
<script src="app.js"></script>
</body>
</html>
